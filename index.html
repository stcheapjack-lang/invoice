<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Products</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body{font-family:Arial;margin:20px;background:#f5f7fa}
h2{margin-top:0}

#loginBox,input,textarea,select,button{
  margin:5px 0;padding:8px;width:100%;max-width:400px
}

.product{
  background:#fff;
  padding:15px;
  margin:10px 0;
  border-radius:6px;
  box-shadow:0 0 5px rgba(0,0,0,.1)
}

.product img{
  max-width:120px;
  margin-right:10px;
}

.adminOnly{display:none}
.admin .adminOnly{display:block}

.flex{display:flex;flex-wrap:wrap}
</style>
</head>

<body>

<h2>Product Catalog</h2>

<!-- LOGIN -->
<div id="loginBox">
  <h3>Admin Login</h3>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<button id="logoutBtn" class="adminOnly" onclick="logout()">Logout</button>

<!-- ADD PRODUCT -->
<div class="adminOnly">
  <h3>Add Product</h3>
  <input id="pname" placeholder="Product Name">
  <input id="category" placeholder="Category">
  <input id="sku" placeholder="SKU">
  <input id="price" placeholder="Price">
  <input id="fabric" placeholder="Fabric">
  <input id="color" placeholder="Color">
  <input id="sizes" placeholder="Sizes (S,M,L)">
  <textarea id="desc" placeholder="Description"></textarea>
  <input id="images" type="file" multiple>
  <button onclick="addProduct()">Save Product</button>
</div>

<hr>

<!-- PRODUCTS -->
<div id="products"></div>

<script>
const supabase = supabase.createClient(
  "https://dkvpsetixqwfnstwveku.supabase.co/",
  "sb_publishable_j-ldptU6SL5EJesFGLChGQ_JZnPbslL"
);

// ---------- AUTH ----------
async function login(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { error } = await supabase.auth.signInWithPassword({ email, password });
  if(error) alert(error.message);
  else location.reload();
}

async function logout(){
  await supabase.auth.signOut();
  location.reload();
}

async function checkAdmin(){
  const { data } = await supabase.auth.getUser();
  if(data.user){
    document.body.classList.add("admin");
    document.getElementById("loginBox").style.display="none";
  }
}
checkAdmin();

// ---------- LOAD PRODUCTS ----------
async function loadProducts(){
  const { data } = await supabase.from("products").select("*").order("created_at",{ascending:false});
  const box = document.getElementById("products");
  box.innerHTML = "";

  data.forEach(p=>{
    let imgs="";
    (p.images||[]).forEach(i=>{
      imgs+=`<img src="${i}">`;
    });

    box.innerHTML += `
      <div class="product">
        <div class="flex">${imgs}</div>
        <h4>${p.product_name}</h4>
        <p>${p.category} | ₹${p.price}</p>
        <p>${p.fabric} | ${p.color} | ${p.sizes}</p>
        <p>${p.description||""}</p>
        <button class="adminOnly" onclick="delProduct('${p.id}')">Delete</button>
      </div>
    `;
  });
}
loadProducts();

// ---------- ADD PRODUCT ----------
async function addProduct(){
  const files = document.getElementById("images").files;
  let urls=[];

  for(let f of files){
    const path = Date.now()+"_"+f.name;
    await supabase.storage.from("product-images").upload(path,f);
    const { data } = supabase.storage.from("product-images").getPublicUrl(path);
    urls.push(data.publicUrl);
  }

  await supabase.from("products").insert([{
    product_name:pname.value,
    category:category.value,
    sku:sku.value,
    price:price.value,
    fabric:fabric.value,
    color:color.value,
    sizes:sizes.value,
    description:desc.value,
    images:urls
  }]);

  alert("Product added");
  location.reload();
}

// ---------- DELETE ----------
async function delProduct(id){
  if(confirm("Delete product?")){
    await supabase.from("products").delete().eq("id",id);
    location.reload();
  }
}
</script>

</body>
</html>
