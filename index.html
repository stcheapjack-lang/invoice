<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Order Form</title>

<style>
*{box-sizing:border-box}

body{
  font-family: Arial, sans-serif;
  background:#f5f7fb;
  padding:20px;
}

.container{
  max-width:1400px;
  margin:auto;
  background:#fff;
  padding:20px;
}

/* ===== HEADER ===== */
.header{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  margin-bottom:10px;
}

.order-ref{
  font-weight:bold;
  font-size:14px;
}

.order-ref input{
  border:none;
  font-weight:bold;
  font-size:14px;
  width:180px;
}

/* ===== SECTION ===== */
.section-title{
  font-weight:bold;
  border-bottom:1px solid #000;
  margin:12px 0 6px;
}

/* ===== TABLE ===== */
table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
  margin-top:8px;
}

th, td{
  border:1px solid #000;
  padding:8px;
  font-size:13px;
  vertical-align:top;
  line-height:1.4;
  position:relative;
}

th{
  background:#f0f0f0;
  text-align:center;
}

/* ===== TEXT ===== */
.wrap{
  white-space:normal;
  word-break:normal;
  overflow-wrap:break-word;
}

/* ===== RESIZER ===== */
.resizer{
  position:absolute;
  right:0;
  top:0;
  width:6px;
  height:100%;
  cursor:col-resize;
}

/* ===== INPUTS ===== */
textarea{
  width:100%;
  border:none;
  resize:none;
  font-family:inherit;
}

input[type=number]{
  width:100%;
  border:none;
  text-align:center;
}

/* ===== BUTTON ===== */
.btn{
  padding:6px 12px;
  font-weight:bold;
  margin:6px 4px;
}

/* ===== TOTALS ===== */
.summary{
  width:360px;
  margin-left:auto;
  margin-top:8px;
}

.summary div{
  display:flex;
  justify-content:space-between;
  margin-bottom:4px;
}

.summary h3{
  border-top:1px solid #000;
  padding-top:6px;
}

/* ===== IMAGE AREA ===== */
.image-area{
  display:flex;
  gap:20px;
  margin-top:10px;
  flex-wrap:wrap;
}

.img-box{
  width:120px;
  height:120px;
  border:1px solid #000;
  display:flex;
  align-items:center;
  justify-content:center;
}

.img-box img{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
}

/* ===== PRINT ===== */
@page{
  size:A4;
  margin:18mm 15mm;
}

@media print{
  .btn,
  input[type=file],
  .del-col,
  .resizer{
    display:none !important;
  }

  body{background:#fff;padding:0}
  .container{padding:0}

  .order-ref input{
    border:none;
  }
}
</style>
</head>

<body>

<div class="container">

<!-- HEADER -->
<div class="header">
  <div></div>
  <div class="order-ref">
    Order Ref :
    <input type="text" id="orderRef">
  </div>
</div>

<!-- CUSTOMER DETAILS -->
<div class="section-title">Customer Details</div>
<textarea rows="1" placeholder="Customer Name"></textarea>
<textarea rows="1" placeholder="Designation"></textarea>

<!-- TABLE -->
<table id="table">
<tr>
  <th style="width:50px">S.No<div class="resizer"></div></th>
  <th>Item<div class="resizer"></div></th>
  <th>Pattern<div class="resizer"></div></th>
  <th>Shade<div class="resizer"></div></th>
  <th style="width:70px">Size</th>
  <th style="width:60px">Qty</th>
  <th style="width:90px">Price ₹</th>
  <th style="width:70px">GST %</th>
  <th style="width:100px">Total ₹</th>
  <th class="del-col" style="width:60px">Del</th>
</tr>
</table>

<button class="btn" onclick="addRow()">+ Add Row</button>

<!-- TOTALS -->
<div class="summary">
  <div><span>Subtotal</span><span>₹ <span id="sub">0.00</span></span></div>
  <div><span>GST</span><span>₹ <span id="gst">0.00</span></span></div>
  <h3>Grand Total ₹ <span id="grand">0.00</span></h3>
</div>

<!-- REMARKS -->
<div class="section-title">Remarks / Special Instructions</div>
<textarea rows="3"></textarea>

<!-- IMAGES -->
<div class="section-title">Reference Images</div>
<div class="image-area">
  <div>
    <div class="img-box"><img></div>
    <input type="file" accept="image/*" onchange="loadImg(this)">
  </div>
  <div>
    <div class="img-box"><img></div>
    <input type="file" accept="image/*" onchange="loadImg(this)">
  </div>
  <div>
    <div class="img-box"><img></div>
    <input type="file" accept="image/*" onchange="loadImg(this)">
  </div>
</div>

<button class="btn" onclick="window.print()">Print / PDF</button>

</div>

<script>
/* ===== ORDER REF AUTO ===== */
(function(){
  const d=new Date();
  const ref="ORD-"+d.getFullYear()
    +String(d.getMonth()+1).padStart(2,"0")
    +String(d.getDate()).padStart(2,"0")
    +"-"+Math.floor(100+Math.random()*900);
  document.getElementById("orderRef").value=ref;
})();

/* ===== ADD ROW ===== */
function addRow(){
  const t=document.getElementById("table");
  const r=t.insertRow();
  const i=t.rows.length-1;

  r.innerHTML=`
    <td>${i}</td>
    <td contenteditable class="wrap"></td>
    <td contenteditable class="wrap"></td>
    <td contenteditable class="wrap"></td>
    <td contenteditable class="wrap"></td>
    <td><input type="number" oninput="calc()"></td>
    <td><input type="number" oninput="calc()"></td>
    <td><input type="number" value="5" oninput="calc()"></td>
    <td>0.00</td>
    <td class="del-col"><button onclick="delRow(this)">X</button></td>
  `;
}

/* ===== DELETE ROW ===== */
function delRow(btn){
  btn.closest("tr").remove();
  renumber();
  calc();
}

function renumber(){
  [...table.rows].forEach((r,i)=>{
    if(i>0) r.cells[0].innerText=i;
  });
}

/* ===== CALCULATION (FIXED) ===== */
function calc(){
  const rows=[...table.rows].slice(1);
  let subTotal=0;
  let gstTotal=0;

  rows.forEach(r=>{
    const q=Number(r.cells[5].children[0].value)||0;
    const p=Number(r.cells[6].children[0].value)||0;
    const g=Number(r.cells[7].children[0].value)||0;

    const amount=q*p;
    const tax=amount*g/100;

    r.cells[8].innerText=(amount+tax).toFixed(2);
    subTotal+=amount;
    gstTotal+=tax;
  });

  document.getElementById("sub").innerText=subTotal.toFixed(2);
  document.getElementById("gst").innerText=gstTotal.toFixed(2);
  document.getElementById("grand").innerText=(subTotal+gstTotal).toFixed(2);
}

/* ===== IMAGE LOAD ===== */
function loadImg(input){
  if(!input.files || !input.files[0]) return;
  const img=input.previousElementSibling.querySelector("img");
  img.src=URL.createObjectURL(input.files[0]);
}

/* ===== RESIZE COLUMNS ===== */
document.querySelectorAll(".resizer").forEach(resizer=>{
  const th=resizer.parentElement;
  let startX,startWidth;

  resizer.addEventListener("mousedown",e=>{
    startX=e.pageX;
    startWidth=th.offsetWidth;
    document.onmousemove=ev=>{
      th.style.width=startWidth+(ev.pageX-startX)+"px";
    };
    document.onmouseup=()=>document.onmousemove=null;
  });
});

addRow();
</script>

</body>
</html>
