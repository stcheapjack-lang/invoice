<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Order Form</title>

<style>
*{box-sizing:border-box}

body{
  font-family: Arial, sans-serif;
  background:#f5f7fb;
  padding:20px;
}

.container{
  max-width:1400px;
  margin:auto;
  background:#fff;
  padding:20px;
}

/* ===== HEADERS ===== */
.section-title{
  font-weight:bold;
  border-bottom:1px solid #000;
  margin:12px 0 6px;
}

/* ===== TABLE ===== */
table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
  margin-top:8px;
}

th, td{
  border:1px solid #000;
  padding:8px;
  font-size:13px;
  vertical-align:top;
  line-height:1.4;
  position:relative;
}

th{
  background:#f0f0f0;
  text-align:center;
}

/* ===== TEXT ===== */
.wrap{
  white-space:normal;
  word-break:normal;
  overflow-wrap:break-word;
}

/* ===== RESIZABLE HANDLE ===== */
.resizer{
  position:absolute;
  right:0;
  top:0;
  width:6px;
  height:100%;
  cursor:col-resize;
}

/* ===== INPUTS ===== */
textarea{
  width:100%;
  border:none;
  resize:none;
  font-family:inherit;
}

input[type=number]{
  width:100%;
  border:none;
  text-align:center;
}

/* ===== BUTTON ===== */
.btn{
  padding:6px 12px;
  font-weight:bold;
  margin:6px 4px;
}

/* ===== TOTALS ===== */
.summary{
  width:360px;
  margin-left:auto;
  margin-top:8px;
}

.summary div{
  display:flex;
  justify-content:space-between;
  margin-bottom:4px;
}

.summary h3{
  border-top:1px solid #000;
  padding-top:6px;
}

/* ===== IMAGE ===== */
.image-area{
  display:flex;
  gap:20px;
  margin-top:10px;
}

.img-box{
  width:120px;
  height:120px;
  border:1px solid #000;
}

/* ===== PRINT ===== */
@page{
  size:A4;
  margin:18mm 15mm;
}

@media print{
  .btn,
  input[type=file],
  .del-col,
  .resizer{
    display:none !important;
  }

  body{background:#fff;padding:0}
  .container{padding:0}
}
</style>
</head>

<body>

<div class="container">

<div class="section-title">Customer Details</div>
<textarea rows="1" placeholder="Customer Name"></textarea>
<textarea rows="1" placeholder="Designation"></textarea>

<table id="table">
<tr>
  <th style="width:50px">S.No<div class="resizer"></div></th>
  <th>Item<div class="resizer"></div></th>
  <th>Pattern<div class="resizer"></div></th>
  <th>Shade<div class="resizer"></div></th>
  <th style="width:70px">Size</th>
  <th style="width:60px">Qty</th>
  <th style="width:90px">Price ₹</th>
  <th style="width:70px">GST %</th>
  <th style="width:100px">Total ₹</th>
  <th class="del-col" style="width:60px">Del</th>
</tr>
</table>

<button class="btn" onclick="addRow()">+ Add Row</button>

<div class="summary">
  <div><span>Subtotal</span><span>₹ <span id="sub">0.00</span></span></div>
  <div><span>GST</span><span>₹ <span id="gst">0.00</span></span></div>
  <h3>Grand Total ₹ <span id="grand">0.00</span></h3>
</div>

<div class="section-title">Remarks / Special Instructions</div>
<textarea rows="3"></textarea>

<div class="section-title">Reference Images</div>
<div class="image-area">
  <div><div class="img-box"></div><input type="file"></div>
  <div><div class="img-box"></div><input type="file"></div>
  <div><div class="img-box"></div><input type="file"></div>
</div>

<button class="btn" onclick="window.print()">Print / PDF</button>

</div>

<script>
/* ===== ADD ROW ===== */
function addRow(){
  let t=document.getElementById("table");
  let r=t.insertRow();
  let i=t.rows.length-1;

  r.innerHTML=`
    <td>${i}</td>
    <td contenteditable class="wrap"></td>
    <td contenteditable class="wrap"></td>
    <td contenteditable class="wrap"></td>
    <td contenteditable class="wrap"></td>
    <td><input type="number" oninput="calc()"></td>
    <td><input type="number" oninput="calc()"></td>
    <td><input type="number" value="5" oninput="calc()"></td>
    <td>0.00</td>
    <td class="del-col"><button onclick="this.closest('tr').remove()">X</button></td>
  `;
}

/* ===== CALC ===== */
function calc(){
  let rows=[...table.rows].slice(1);
  let sub=0,gst=0;
  rows.forEach(r=>{
    let q=+r.cells[5].children[0].value||0;
    let p=+r.cells[6].children[0].value||0;
    let g=+r.cells[7].children[0].value||0;
    let amt=q*p;
    let tax=amt*g/100;
    r.cells[8].innerText=(amt+tax).toFixed(2);
    sub+=amt; gst+=tax;
  });
  sub.innerText=sub.toFixed(2);
  gst.innerText=gst.toFixed(2);
  grand.innerText=(sub+gst).toFixed(2);
}

/* ===== RESIZE COLUMNS ===== */
document.querySelectorAll(".resizer").forEach(resizer=>{
  let th=resizer.parentElement;
  let startX, startWidth;

  resizer.addEventListener("mousedown",e=>{
    startX=e.pageX;
    startWidth=th.offsetWidth;
    document.onmousemove=ev=>{
      th.style.width=startWidth+(ev.pageX-startX)+"px";
    };
    document.onmouseup=()=>{
      document.onmousemove=null;
    };
  });
});

addRow();
</script>

</body>
</html>
