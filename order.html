<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Order Form</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f4f6fb;
}

/* ===== LAYOUT ===== */
.app{
  display:flex;
  min-height:100vh;
}

/* ===== SIDEBAR ===== */
.sidebar{
  width:220px;
  background:#1f2937;
  color:#fff;
  padding:20px 0;
  position:fixed;
  top:0;
  bottom:0;
  left:0;
}

.brand{
  font-size:18px;
  font-weight:bold;
  padding:0 20px 20px;
  border-bottom:1px solid rgba(255,255,255,0.15);
}

.sidebar a{
  display:block;
  padding:12px 20px;
  color:#fff;
  text-decoration:none;
  font-size:14px;
}

.sidebar a:hover,
.sidebar a.active{
  background:#374151;
}

/* ===== MAIN ===== */
.main{
  margin-left:220px;
  padding:25px;
  width:100%;
  background:#f5f7fb;
}

.container{
  max-width:1400px;
  margin:auto;
  background:#fff;
  padding:20px;
}

/* ===== HEADER ===== */
.header{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  margin-bottom:10px;
}

.order-ref{
  font-weight:bold;
}

.order-ref input{
  border:none;
  font-weight:bold;
  width:180px;
}

/* ===== SECTION ===== */
.section-title{
  font-weight:bold;
  border-bottom:1px solid #000;
  margin:12px 0 6px;
}

/* ===== TABLE ===== */
table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
}

th, td{
  border:1px solid #000;
  padding:8px;
  font-size:13px;
  vertical-align:top;
  line-height:1.4;
  position:relative;
}

th{
  background:#f0f0f0;
  text-align:center;
}

/* ===== TEXT ===== */
.wrap{
  white-space:normal;
  overflow-wrap:break-word;
}

/* ===== RESIZER ===== */
.resizer{
  position:absolute;
  right:0;
  top:0;
  width:6px;
  height:100%;
  cursor:col-resize;
}

/* ===== INPUTS ===== */
textarea{
  width:100%;
  border:none;
  resize:none;
  font-family:inherit;
}

input[type=number]{
  width:100%;
  border:none;
  text-align:center;
}

/* ===== BUTTON ===== */
.btn{
  padding:6px 12px;
  font-weight:bold;
  margin:6px 4px;
}

/* ===== TOTALS ===== */
.summary{
  width:360px;
  margin-left:auto;
  margin-top:8px;
}

.summary div{
  display:flex;
  justify-content:space-between;
  margin-bottom:4px;
}

.summary h3{
  border-top:1px solid #000;
  padding-top:6px;
}

/* ===== IMAGE AREA ===== */
.image-area{
  display:flex;
  gap:20px;
  margin-top:10px;
  flex-wrap:wrap;
}

.img-box{
  width:120px;
  height:120px;
  border:1px solid #000;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.img-box img{
  width:100%;
  height:100%;
  object-fit:contain;
}

/* ===== PRINT ===== */
@page{
  size:A4;
  margin:18mm 15mm;
}

@media print{
  .sidebar,
  .btn,
  input[type=file],
  .del-col,
  .resizer{
    display:none !important;
  }

  body{background:#fff}
  .main{margin:0;padding:0}
  .container{padding:0}

  table{
    margin-top:12mm;
  }

  thead{
    display:table-header-group;
  }

  tr{
    page-break-inside:avoid;
  }
}
</style>
</head>

<body>

<div class="app">

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="brand">STCHEAPJACK</div>
  <a href="index.html">Dashboard</a>
  <a href="quotation.html">Quotation</a>
  <a href="order.html" class="active">Order Form</a>
  <a href="catalog.html">Product Catalog</a>
  <a href="manufacturing.html">Manufacturing Slip</a>
</div>

<!-- MAIN -->
<div class="main">
<div class="container">

<div class="header">
  <h2>ORDER FORM</h2>
  <div class="order-ref">
    Order Ref:
    <input type="text" id="orderRef">
  </div>
</div>

<div class="section-title">Customer Details</div>
<textarea rows="1" placeholder="Customer Name"></textarea>
<textarea rows="1" placeholder="Designation"></textarea>

<table id="table">
<thead>
<tr>
  <th style="width:50px">S.No<div class="resizer"></div></th>
  <th>Item<div class="resizer"></div></th>
  <th>Pattern<div class="resizer"></div></th>
  <th>Shade<div class="resizer"></div></th>
  <th style="width:70px">Size</th>
  <th style="width:60px">Qty</th>
  <th style="width:90px">Price ₹</th>
  <th style="width:70px">GST %</th>
  <th style="width:100px">Total ₹</th>
  <th class="del-col" style="width:60px">Del</th>
</tr>
</thead>
<tbody></tbody>
</table>

<button class="btn" onclick="addRow()">+ Add Row</button>

<div class="summary">
  <div><span>Subtotal</span><span>₹ <span id="sub">0.00</span></span></div>
  <div><span>GST</span><span>₹ <span id="gst">0.00</span></span></div>
  <h3>Grand Total ₹ <span id="grand">0.00</span></h3>
</div>

<div class="section-title">Remarks / Special Instructions</div>
<textarea rows="3"></textarea>

<div class="section-title">Reference Images</div>
<div class="image-area">
  <div><div class="img-box"><img></div><input type="file" onchange="loadImg(this)"></div>
  <div><div class="img-box"><img></div><input type="file" onchange="loadImg(this)"></div>
  <div><div class="img-box"><img></div><input type="file" onchange="loadImg(this)"></div>  
</div>

<button class="btn" onclick="window.print()">Print / PDF</button>

</div>
</div>
</div>

<script>
(()=>{
  const d=new Date();
  orderRef.value="ORD-"+d.getFullYear()
  +String(d.getMonth()+1).padStart(2,"0")
  +String(d.getDate()).padStart(2,"0")
  +"-"+Math.floor(100+Math.random()*900);
})();

function addRow(){
  const tb=document.querySelector("#table tbody");
  const r=tb.insertRow();
  r.innerHTML=`
    <td>${tb.rows.length}</td>
    <td contenteditable class="wrap"></td>
    <td contenteditable class="wrap"></td>
    <td contenteditable class="wrap"></td>
    <td contenteditable class="wrap"></td>
    <td><input type="number" oninput="calc()"></td>
    <td><input type="number" oninput="calc()"></td>
    <td><input type="number" value="5" oninput="calc()"></td>
    <td>0.00</td>
    <td class="del-col"><button onclick="this.closest('tr').remove();calc()">X</button></td>
  `;
}

function calc(){
  let s=0,g=0;
  [...document.querySelector("#table tbody").rows].forEach(r=>{
    let q=+r.cells[5].children[0].value||0;
    let p=+r.cells[6].children[0].value||0;
    let gst=+r.cells[7].children[0].value||0;
    let amt=q*p, tax=amt*gst/100;
    r.cells[8].innerText=(amt+tax).toFixed(2);
    s+=amt; g+=tax;
  });
  sub.innerText=s.toFixed(2);
  gst.innerText=g.toFixed(2);
  grand.innerText=(s+g).toFixed(2);
}

function loadImg(i){
  i.previousElementSibling.querySelector("img").src=URL.createObjectURL(i.files[0]);
}

document.querySelectorAll(".resizer").forEach(r=>{
  const th=r.parentElement;
  let x,w;
  r.onmousedown=e=>{
    x=e.pageX; w=th.offsetWidth;
    document.onmousemove=ev=>th.style.width=w+(ev.pageX-x)+"px";
    document.onmouseup=()=>document.onmousemove=null;
  };
});

addRow();
</script>

</body>
</html>
