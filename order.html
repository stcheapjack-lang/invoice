<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Order Form V2</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#111}.wrap{min-height:100vh}.main{padding:20px;max-width:1400px;margin:auto}.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 4px 16px rgba(0,0,0,.08)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.grid input,.grid select,.grid textarea{width:100%;padding:8px;border:1px solid #ccc;border-radius:8px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.btn{border:none;background:#2563eb;color:#fff;padding:10px 14px;border-radius:10px;cursor:pointer}.btn.gray{background:#6b7280}.btn.green{background:#059669}.btn.red{background:#dc2626}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{border:1px solid #ddd;padding:8px;font-size:14px;vertical-align:top}th{background:#f9fafb}td input,td select{width:100%;border:none;padding:6px}td textarea{width:100%;border:none;padding:6px;resize:none;overflow:hidden;min-height:34px;font-family:Arial,sans-serif;white-space:pre-wrap;overflow-wrap:anywhere}.right{text-align:right}.summary{margin-left:auto;max-width:360px;margin-top:15px}.summary div{display:flex;justify-content:space-between;padding:4px 0}.big{font-size:20px;font-weight:700;border-top:2px solid #111;padding-top:8px}.muted{font-size:12px;color:#666}.sign{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:30px}.line{border-top:1px solid #111;padding-top:6px;text-align:center}.imgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.imgbox{border:1px dashed #999;border-radius:10px;padding:10px;min-height:180px}.imgbox img{width:100%;height:120px;object-fit:contain}.hide-print{display:block}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media print{.toolbar,.hide-print{display:none!important}.main{padding:0}.card{box-shadow:none;border-radius:0}}
</style>
</head>
<body>
<div class='wrap'>
<div class='main'>
<div class='card'>
<h1 style='text-align:center;margin:0'>ST TRADERS CHEAPJACK</h1><h2 style='margin:0 0 10px;font-size:22px;text-align:center'>ORDER FORM</h2>
<div class='muted' style='text-align:center'>Trusted Medical Wear for Comfort, Quality & Care</div>
<div class='grid' style='margin-top:12px'>
<input id='oref' placeholder='Order Ref'>
<input id='odate' type='date'>
<input id='cname' placeholder='Customer Name'>
<input id='phone' placeholder='Phone'>
<input id='addr' placeholder='Address'>
<input id='gstno' placeholder='GST No'>

</div>
<div class='toolbar'>
<button class='btn' onclick='addRow()'>+ Row</button>
<button class='btn green' onclick='saveDraft()'>Save</button>
<button class='btn gray' onclick='loadDraft()'>Load</button>
<button class='btn gray' onclick='downloadCSV()'>CSV</button>
<button class='btn red' onclick='newForm()'>New</button>
<button class='btn' onclick='window.print()'>Print</button>
</div>
<table id='tbl'>
<thead><tr><th style='width:40px'>#</th><th>Item</th><th>Pattern</th><th style='width:70px'>Size</th><th style='width:70px'>Qty</th><th style='width:90px'>Price</th><th style='width:110px'>Taxable Total</th><th class='hide-print' style='width:50px'>X</th></tr></thead>
<tbody></tbody></table>
<div class='summary'>
<div><span>Total Qty</span><span id='tqty'>0</span></div>
<div><span>Subtotal</span><span id='sub'>0.00</span></div>
<div><span>GST</span><span id='gst'>0.00</span></div>
<div class='big'><span>Total</span><span id='grand'>0.00</span></div>
</div>
<h3>Reference Images</h3>
<div class='imgs'>
<div class='imgbox'><img><input type='file' onchange='imgLoad(this)'><textarea placeholder='Notes'></textarea></div>
<div class='imgbox'><img><input type='file' onchange='imgLoad(this)'><textarea placeholder='Notes'></textarea></div>
<div class='imgbox'><img><input type='file' onchange='imgLoad(this)'><textarea placeholder='Notes'></textarea></div>
</div>


</div>
</div></div></div>
<script>
function init(){const d=new Date();oref.value='ORD-'+Date.now().toString().slice(-6);odate.valueAsDate=d;addRow();loadDraft()}function addRow(){let tb=document.querySelector('#tbl tbody');let r=tb.insertRow();r.innerHTML=`<td>${tb.rows.length}</td><td><textarea oninput='grow(this)'></textarea></td><td><textarea oninput='grow(this)'></textarea></td><td><input></td><td><input type='number' value='0' oninput='calc()'></td><td><input type='number' value='0' oninput='calc()'></td><td class='right'>0.00</td><td class='hide-print'><button onclick='this.closest("tr").remove();renum();calc()'>X</button></td>`}function renum(){[...document.querySelector('#tbl tbody').rows].forEach((r,i)=>r.cells[0].innerText=i+1)}function calc(){let s=0,g=0,q=0;[...document.querySelector('#tbl tbody').rows].forEach(r=>{let qty=+r.cells[4].querySelector('input').value||0;let price=+r.cells[5].querySelector('input').value||0;let amt=qty*price;r.cells[6].innerText=amt.toFixed(2);s+=amt;q+=qty});tqty.innerText=q;sub.innerText=s.toFixed(2);g=s*0.05;gst.innerText=g.toFixed(2);grand.innerText=(s+g).toFixed(2)}function saveDraft(){localStorage.setItem('order_v2',document.querySelector('.card').innerHTML);alert('Saved')}function loadDraft(){calc()}function newForm(){location.reload()}function downloadCSV(){let rows=[['Item','Pattern','Size','Qty','Price','Total']];[...document.querySelector('#tbl tbody').rows].forEach(r=>rows.push([r.cells[1].querySelector('input').value,r.cells[2].querySelector('input').value,r.cells[3].querySelector('input').value,r.cells[4].querySelector('input').value,r.cells[5].querySelector('input').value,r.cells[6].innerText]));let csv=rows.map(e=>e.join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv]));a.download='order.csv';a.click()}function imgLoad(i){i.parentElement.querySelector('img').src=URL.createObjectURL(i.files[0])}function grow(el){el.style.height='34px';el.style.height=el.scrollHeight+'px'}init();
</script>
</body></html>
