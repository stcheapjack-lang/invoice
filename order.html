<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Order Form</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f4f6fb;
}

/* ===== LAYOUT ===== */
.app{
  display:flex;
  min-height:100vh;
}

/* ===== SIDEBAR ===== */
.sidebar{
  width:220px;
  background:#1f2937;
  color:#fff;
  padding:20px 0;
  position:fixed;
  top:0;
  bottom:0;
  left:0;
}

.brand{
  font-size:18px;
  font-weight:bold;
  padding:0 20px 20px;
  border-bottom:1px solid rgba(255,255,255,0.15);
}

.sidebar a{
  display:block;
  padding:12px 20px;
  color:#fff;
  text-decoration:none;
  font-size:14px;
}

.sidebar a:hover,
.sidebar a.active{
  background:#374151;
}

/* ===== MAIN ===== */
.main{
  margin-left:220px;
  padding:25px;
  width:100%;
  background:#f5f7fb;
}

.container{
  max-width:1400px;
  margin:auto;
  background:#fff;
  padding:20px;
}

/* ===== HEADER ===== */
.header{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  margin-bottom:10px;
}

.order-ref{
  font-weight:bold;
}

.order-ref input{
  border:none;
  font-weight:bold;
  width:180px;
}

/* ===== SECTION ===== */
.section-title{
  font-weight:bold;
  border-bottom:1px solid #000;
  margin:12px 0 6px;
}

/* ===== TABLE ===== */
table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
  margin-top:8px;
}

th, td{
  border:1px solid #000;
  padding:8px;
  font-size:13px;
  vertical-align:top;
  line-height:1.4;
  position:relative;
}

th{
  background:#f0f0f0;
  text-align:center;
}

/* ===== TEXT ===== */
.wrap{
  white-space:normal;
  word-break:normal;
  overflow-wrap:break-word;
}

/* ===== RESIZER ===== */
.resizer{
  position:absolute;
  right:0;
  top:0;
  width:6px;
  height:100%;
  cursor:col-resize;
}

/* ===== INPUTS ===== */
textarea{
  width:100%;
  border:none;
  resize:none;
  font-family:inherit;
}

input[type=number]{
  width:100%;
  border:none;
  text-align:center;
}

/* ===== BUTTON ===== */
.btn{
  padding:6px 12px;
  font-weight:bold;
  margin:6px 4px;
}

/* ===== TOTALS ===== */
.summary{
  width:360px;
  margin-left:auto;
  margin-top:8px;
}

.summary div{
  display:flex;
  justify-content:space-between;
  margin-bottom:4px;
}

.summary h3{
  border-top:1px solid #000;
  padding-top:6px;
}

/* ===== IMAGE AREA ===== */
.image-area{
  display:flex;
  gap:20px;
  margin-top:10px;
  flex-wrap:wrap;
}

.img-box{
  width:120px;
  height:120px;
  border:1px solid #000;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.img-box img{
  width:100%;
  height:100%;
  object-fit:contain;
}

/* ===== PRINT ===== */
@page{
  size:A4;
  margin:18mm 15mm;
}

@media print{
  .sidebar,
  .btn,
  input[type=file],
  .del-col,
  .resizer{
    display:none !important;
  }

  body{background:#fff}
  .main{margin:0;padding:0}
  .container{padding:0}
}
</style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="brand">STCHEAPJACK</div>
    <a href="index.html">Dashboard</a>
    <a href="quotation.html">Quotation</a>
    <a href="order.html" class="active">Order Form</a>
    <a href="catalog.html">Product Catalog</a>
    <a href="manufacturing.html">Manufacturing Slip</a>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="container">

      <!-- HEADER -->
      <div class="header">
        <h2>ORDER FORM</h2>
        <div class="order-ref">
          Order Ref:
          <input type="text" id="orderRef">
        </div>
      </div>

      <!-- CUSTOMER -->
      <div class="section-title">Customer Details</div>
      <textarea rows="1" placeholder="Customer Name"></textarea>
      <textarea rows="1" placeholder="Designation"></textarea>

      <!-- TABLE -->
      <table id="table">
        <tr>
          <th style="width:50px">S.No<div class="resizer"></div></th>
          <th>Item<div class="resizer"></div></th>
          <th>Pattern<div class="resizer"></div></th>
          <th>Shade<div class="resizer"></div></th>
          <th style="width:70px">Size</th>
          <th style="width:60px">Qty</th>
          <th style="width:90px">Price ₹</th>
          <th style="width:70px">GST %</th>
          <th style="width:100px">Total ₹</th>
          <th class="del-col" style="width:60px">Del</th>
        </tr>
      </table>

      <button class="btn" onclick="addRow()">+ Add Row</button>

      <!-- TOTALS -->
      <div class="summary">
        <div><span>Subtotal</span><span>₹ <span id="sub">0.00</span></span></div>
        <div><span>GST</span><span>₹ <span id="gst">0.00</span></span></div>
        <h3>Grand Total ₹ <span id="grand">0.00</span></h3>
      </div>

      <!-- REMARKS -->
      <div class="section-title">Remarks / Special Instructions</div>
      <textarea rows="3"></textarea>

      <!-- IMAGES -->
      <div class="section-title">Reference Images</div>
      <div class="image-area">
        <div>
          <div class="img-box"><img></div>
          <input type="file" accept="image/*" onchange="loadImg(this)">
        </div>
        <div>
          <div class="img-box"><img></div>
          <input type="file" accept="image/*" onchange="loadImg(this)">
        </div>
        <div>
          <div class="img-box"><img></div>
          <input type="file" accept="image/*" onchange="loadImg(this)">
        </div>
      </div>

      <button class="btn" onclick="window.print()">Print / PDF</button>

    </div>
  </div>

</div>

<script>
/* ORDER REF */
(()=>{
  const d=new Date();
  orderRef.value="ORD-"+d.getFullYear()
    +String(d.getMonth()+1).padStart(2,"0")
    +String(d.getDate()).padStart(2,"0")
    +"-"+Math.floor(100+Math.random()*900);
})();

/* ADD ROW */
function addRow(){
  const r=table.insertRow();
  r.innerHTML=`
    <td>${table.rows.length-1}</td>
    <td contenteditable class="wrap"></td>
    <td contenteditable class="wrap"></td>
    <td contenteditable class="wrap"></td>
    <td contenteditable class="wrap"></td>
    <td><input type="number" oninput="calc()"></td>
    <td><input type="number" oninput="calc()"></td>
    <td><input type="number" value="5" oninput="calc()"></td>
    <td>0.00</td>
    <td class="del-col"><button onclick="this.closest('tr').remove();calc()">X</button></td>
  `;
}

/* CALC */
function calc(){
  let subT=0, gstT=0;
  [...table.rows].slice(1).forEach(r=>{
    const q=+r.cells[5].children[0].value||0;
    const p=+r.cells[6].children[0].value||0;
    const g=+r.cells[7].children[0].value||0;
    const amt=q*p, tax=amt*g/100;
    r.cells[8].innerText=(amt+tax).toFixed(2);
    subT+=amt; gstT+=tax;
  });
  sub.innerText=subT.toFixed(2);
  gst.innerText=gstT.toFixed(2);
  grand.innerText=(subT+gstT).toFixed(2);
}

/* IMAGE */
function loadImg(input){
  const img=input.previousElementSibling.querySelector("img");
  img.src=URL.createObjectURL(input.files[0]);
}

/* RESIZE */
document.querySelectorAll(".resizer").forEach(r=>{
  const th=r.parentElement;
  let sx, sw;
  r.onmousedown=e=>{
    sx=e.pageX; sw=th.offsetWidth;
    document.onmousemove=ev=>th.style.width=sw+(ev.pageX-sx)+"px";
    document.onmouseup=()=>document.onmousemove=null;
  };
});

addRow();
</script>

</body>
</html>
