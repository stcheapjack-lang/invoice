<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quotation</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f4f6fb;
}

/* ===== LAYOUT ===== */
.app{display:flex;min-height:100vh}

/* ===== SIDEBAR ===== */
.sidebar{
  width:220px;
  background:#1f2937;
  color:#fff;
  padding:20px 0;
  position:fixed;
  top:0;bottom:0;left:0;
}
.brand{
  font-size:18px;
  font-weight:bold;
  padding:0 20px 20px;
  border-bottom:1px solid rgba(255,255,255,0.15);
}
.sidebar a{
  display:block;
  padding:12px 20px;
  color:#fff;
  text-decoration:none;
}
.sidebar a.active,
.sidebar a:hover{background:#374151}

/* ===== MAIN ===== */
.main{
  margin-left:220px;
  padding:25px;
  width:100%;
}
.container{
  max-width:1200px;
  margin:auto;
  background:#fff;
  padding:20px;
}

/* ===== HEADER ===== */
.header{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
}
.ref input{
  border:none;
  font-weight:bold;
}

/* ===== SECTION ===== */
.section-title{
  font-weight:bold;
  border-bottom:1px solid #000;
  margin:14px 0 6px;
}

/* ===== TABLE ===== */
table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
  margin-top:6px;
}
th,td{
  border:1px solid #000;
  padding:6px;
  font-size:12px;
  vertical-align:top;
  word-wrap:break-word;
}
th{
  background:#f0f0f0;
  text-align:center;
}
tr{page-break-inside:avoid}

/* ===== INPUTS ===== */
textarea{
  width:100%;
  border:none;
  resize:none;
  font-family:inherit;
  font-size:12px;
}
input[type=number]{
  width:100%;
  border:none;
  text-align:center;
}

/* ===== BUTTON ===== */
.btn{
  padding:6px 12px;
  font-weight:bold;
  margin:6px 4px;
}

/* ===== TOTALS ===== */
.summary{
  width:320px;
  margin-left:auto;
}
.summary div{
  display:flex;
  justify-content:space-between;
}
.summary h3{
  border-top:1px solid #000;
  padding-top:6px;
}

/* ===== PRINT ===== */
@page{
  size:A4;
  margin:15mm;
}
@media print{
  .sidebar,.btn{display:none!important}
  body{background:#fff}
  .main{margin:0;padding:0}
  .container{padding:0}
}
</style>
</head>

<body>

<div class="app">

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="brand">STCHEAPJACK</div>
  <a href="index.html">Dashboard</a>
  <a href="quotation.html" class="active">Quotation</a>
  <a href="order.html">Order Form</a>
  <a href="catalog.html">Product Catalog</a>
  <a href="manufacturing.html">Manufacturing Slip</a>
</div>

<!-- MAIN -->
<div class="main">
<div class="container">

<div class="header">
  <h2>QUOTATION</h2>
  <div class="ref">
    Quotation Ref:
    <input id="quoteRef">
  </div>
</div>

<div class="section-title">Customer Details</div>
<textarea rows="1" placeholder="Customer Name"></textarea>
<textarea rows="1" placeholder="Designation / Company"></textarea>

<table id="table">
<tr>
  <th style="width:40px">S.No</th>
  <th>Description</th>
  <th style="width:60px">Qty</th>
  <th style="width:80px">Rate ₹</th>
  <th style="width:80px">Amount ₹</th>
</tr>
</table>

<button class="btn" onclick="addRow()">+ Add Row</button>

<div class="summary">
  <div><span>Subtotal</span><span>₹ <span id="sub">0.00</span></span></div>
  <div>
    <span>GST %</span>
    <span>
      <input type="number" id="gstRate" value="5" style="width:40px;border:1px solid #000" oninput="calc()"> %
    </span>
  </div>
  <div><span>GST</span><span>₹ <span id="gst">0.00</span></span></div>
  <h3>Grand Total ₹ <span id="grand">0.00</span></h3>
</div>

<div class="section-title">Terms / Notes</div>
<textarea rows="3" placeholder="Validity, delivery timeline, terms & conditions"></textarea>

<button class="btn" onclick="window.print()">Print / PDF</button>

</div>
</div>
</div>

<script>
/* QUOTE REF */
(()=>{quoteRef.value="QT-"+Date.now().toString().slice(-6)})();

/* ADD ROW */
function addRow(){
  const r=table.insertRow();
  r.innerHTML=`
  <td>${table.rows.length-1}</td>
  <td contenteditable></td>
  <td><input type="number" oninput="calc()"></td>
  <td><input type="number" oninput="calc()"></td>
  <td>0.00</td>`;
}

/* CALC */
function calc(){
  let subtotal=0;
  [...table.rows].slice(1).forEach(r=>{
    let q=+r.cells[2].children[0].value||0;
    let p=+r.cells[3].children[0].value||0;
    let amt=q*p;
    r.cells[4].innerText=amt.toFixed(2);
    subtotal+=amt;
  });
  let gstAmt=subtotal*(+gstRate.value||0)/100;
  sub.innerText=subtotal.toFixed(2);
  gst.innerText=gstAmt.toFixed(2);
  grand.innerText=(subtotal+gstAmt).toFixed(2);
}

addRow();
</script>

</body>
</html>
